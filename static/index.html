<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<title>热量记录</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#18211d;--sub:#8a958f;--ac:#10b981;--ac2:#059669;--or:#f97316;--rd:#ef4444;--bd:#e6ece8;--sh:0 4px 18px rgba(16,60,40,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#19211d;--tx:#e9f0ec;--sub:#86928c;--bd:#26312b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;cursor:pointer;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
header h1{margin:0;font-size:20px;text-align:center;line-height:1.2}header small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.rb{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:18px}
main{flex:1;overflow-y:auto;padding:6px 16px 16px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#10b981,#0d9488);color:#fff;border-radius:24px;padding:18px;margin:8px 0 12px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 26px rgba(16,185,129,.3)}
.hero.over{background:linear-gradient(135deg,#f97316,#ef4444);box-shadow:0 10px 26px rgba(239,68,68,.28)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.tr{stroke:rgba(255,255,255,.25)}.pg{stroke:#fff;transition:stroke-dasharray .6s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid b{font-size:28px;line-height:1.1}.mid span{font-size:11px;opacity:.85}
.stats{flex:1;display:grid;gap:10px}.stats div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:6px}
.stats div:last-child{border:0}.stats span{font-size:13px;opacity:.85}.stats b{font-size:18px}
.sec{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:4px}
.sec em{font-style:normal;font-weight:400;font-size:12px;color:var(--sub)}
.sec.tap{cursor:pointer;margin-bottom:0}
.sec .ar{display:inline-block;margin-left:6px;font-size:11px;color:var(--sub);transition:transform .2s}
.card.fold .sec .ar{transform:rotate(-90deg)}
.card.fold .body{display:none}
.body{padding-top:4px}
.grp{font-size:12px;color:var(--sub);margin:10px 0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .n{min-width:0}.row .n small{display:block;color:var(--sub);font-size:12px;white-space:pre-wrap}
.k{white-space:nowrap;font-weight:600}.k.w{color:var(--or)}
.x{border:0;background:none;color:var(--sub);padding:2px 6px;font-size:14px}
.empty{color:var(--sub);font-size:13px;padding:6px 0}
.me{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:18px 18px 4px 18px;padding:9px 14px;margin:10px 0 10px auto;max-width:82%;width:fit-content;white-space:pre-wrap}
.bot{border:1px solid var(--bd);border-radius:18px 18px 18px 4px;max-width:94%}
.bot .why{font-size:13px;color:var(--sub);margin-bottom:4px}
.bot input{width:68px;text-align:right;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:4px 8px;font:inherit;font-weight:600}
.warn{color:#d97706;font-size:13px}
.btns{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);font-weight:600}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--sub)}
#bar{display:flex;gap:8px;align-items:flex-end;margin:0 12px 8px;padding:6px 6px 6px 8px;background:var(--card);border-radius:26px;box-shadow:0 6px 24px rgba(16,60,40,.14)}
#bar textarea{flex:1;resize:none;max-height:110px;border:0;outline:0;background:none;color:var(--tx);font:inherit;padding:8px 2px}
.ib{width:40px;height:40px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--sub);flex:none}
.ib.s{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}.ib:disabled{opacity:.5}
.badge{position:absolute;top:-4px;right:-4px;background:var(--or);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
nav button.on{color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.cal button{aspect-ratio:1/1.15;border:0;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;padding:0}
.cal button small{font-size:10px;color:var(--ac);font-weight:500;line-height:1.1}.cal button small.b{color:var(--or)}.cal button small.g{color:#3b82f6}.cal button small.s{color:#8b5cf6}
.cal button.t{outline:2px solid var(--ac)}.cal button.has{background:linear-gradient(180deg,var(--card),rgba(16,185,129,.12))}
.cal i{visibility:hidden}
label{display:block;margin:14px 0 4px;color:var(--sub);font-size:13px}
.f{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.err{color:var(--rd)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:var(--sh);margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:11px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
svg.ch{width:100%;height:auto;margin-top:6px}
</style></head><body>
<header><button class="rb" id="prev" onclick="shift(-1)">‹</button><h1 id="title"></h1><button class="rb" id="next" onclick="shift(1)">›</button></header>
<main id="main"></main>
<div id="bar">
 <button class="ib" style="position:relative" onclick="document.getElementById('file').click()"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="badge" id="nimg" hidden></span></button>
 <textarea id="txt" rows="1" placeholder="说说你吃了什么、练了什么…"></textarea>
 <button class="ib s" id="send" onclick="send()"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
 <input id="file" type="file" accept="image/*" multiple hidden>
</div>
<nav>
 <button id="n-day" onclick="go('day')"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>记录</button>
 <button id="n-cal" onclick="go('cal')"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>日历</button>
 <button id="n-set" onclick="go('set')"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/></svg>目标</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const ymd=d=>d.toLocaleDateString('sv');
const tmr=()=>{const d=new Date();d.setDate(d.getDate()+1);return ymd(d)};
function dur(a,b){const x=a.split(':').map(Number),y=b.split(':').map(Number);let m=(y[0]*60+y[1])-(x[0]*60+x[1]);if(m<0)m+=1440;return Math.floor(m/60)+'h'+(m%60)+'m'}
function sleepTxt(s){
  const isNap=s.sleep_time&&s.wake_time&&s.sleep_time>='10:00'&&s.wake_time<='20:00';
  if(isNap)return `😴 午休 ${esc(s.sleep_time)} → ${esc(s.wake_time)} · ${dur(s.sleep_time,s.wake_time)}`;
  let t=(s.sleep_time?'🌙 '+esc(s.sleep_time):'')+(s.sleep_time&&s.wake_time?' → ':'')+(s.wake_time?'☀️ '+esc(s.wake_time):'');
  if(s.sleep_time&&s.wake_time)t+=' · '+dur(s.sleep_time,s.wake_time);
  return t}
const MI={'早餐':'🌅','午餐':'🍱','晚餐':'🌙','加餐':'🍎'};
const EX=['我刚起床，吃了一个拳头大小的无糖面包','晚上吃了一根香蕉，100kcal','1001健身记录\n羽毛球 1h\n高位下拉 4x12 20kg'];
let token=localStorage.t||'',date=ymd(new Date()),view='day',imgs=[],chat={},profile={},calMonth=date.slice(0,7),calMode='c';
async function api(p,o={}){
  const r=await fetch('api/'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json','X-Token':token},body:o.body&&JSON.stringify(o.body)});
  if(r.status==401){token=prompt('访问口令')||'';localStorage.t=token;return api(p,o)}
  if(!r.ok)throw new Error((await r.text()).slice(0,200));return r.json()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(v){view=v;render()}
function shift(n){
  if(view==='cal'){const[y,m]=calMonth.split('-').map(Number);calMonth=ymd(new Date(y,m-1+n,1)).slice(0,7)}
  else{const d=new Date(date+'T00:00');d.setDate(d.getDate()+n);date=ymd(d)}
  render()}
async function render(){
  try{
    ['day','cal','set'].forEach(v=>$('#n-'+v).classList.toggle('on',v===view));
    $('#bar').style.display=view==='day'?'flex':'none';
    $('#prev').style.visibility=$('#next').style.visibility=view==='set'?'hidden':'visible';
    if(view==='day'){
      const dd=new Date(date+'T00:00');
      $('#title').innerHTML=dd.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+`<small>${dd.toLocaleDateString('zh-CN',{weekday:'long'})}${date===ymd(new Date())?' · 今天':''}</small>`;
      await renderDay()}
    else if(view==='cal'){const[y,m]=calMonth.split('-');$('#title').innerHTML=`${y}年${+m}月`;await renderCal()}
    else{$('#title').innerHTML='我的目标';await renderSet()}
  }catch(e){$('#main').innerHTML=`<div class="card err">出错了：${esc(e.message)}</div>`}}
async function renderDay(){
  const d=await api('day?date='+date);
  const bud=d.budget,left=bud!=null?bud-d.intake:null,over=left!=null&&left<0,pct=bud?Math.min(d.intake/bud,1):0,C=2*Math.PI*54;
  let h=`<section class="hero ${over?'over':''}"><div class="ring"><svg viewBox="0 0 128 128"><circle class="tr" cx="64" cy="64" r="54"/><circle class="pg" cx="64" cy="64" r="54" style="stroke-dasharray:${C*pct} ${C}"/></svg>
  <div class="mid"><b>${left==null?'-':Math.abs(left)}</b><span>${over?'已超出 kcal':'还可摄入 kcal'}</span></div></div>
  <div class="stats"><div><span>摄入</span><b>${d.intake}</b></div><div><span>运动消耗</span><b>${d.burn}</b></div><div><span>今日预算</span><b>${bud??'-'}</b></div></div></section>`;
  if(!profile.height_cm)h+=`<div class="card">👉 先到「目标」页填写身高体重和减肥目标，才能计算每日预算。</div>`;
  h+=`<div class="card"><div class="sec tap" onclick="fold(this)">饮食<em>${d.intake} kcal<span class="ar">▾</span></em></div><div class="body">`;
  if(!d.meals.length)h+=`<div class="empty">还没有记录</div>`;
  for(const t of ['早餐','午餐','晚餐','加餐']){
    const L=d.meals.filter(m=>m.meal_type===t);if(!L.length)continue;
    h+=`<div class="grp">${MI[t]} ${t} · ${Math.round(L.reduce((a,m)=>a+m.kcal,0))} kcal</div>`+L.map(m=>`<div class="row"><div class="n">${esc(m.name)}<small>${esc(m.time)} ${esc(m.amount)}</small></div><div class="k">${Math.round(m.kcal)}<button class="x" onclick="del('meals',${m.id})">✕</button></div></div>`).join('')}
  h+=`</div></div><div class="card"><div class="sec tap" onclick="fold(this)">运动<em>${d.burn} kcal<span class="ar">▾</span></em></div><div class="body">`;
  h+=d.workouts.map(w=>`<div class="row"><div class="n">${esc(w.name)}<small>${esc(w.detail)}</small></div><div class="k w">-${Math.round(w.kcal)}<button class="x" onclick="del('workouts',${w.id})">✕</button></div></div>`).join('')||`<div class="empty">还没有记录</div>`;
  h+=`</div></div><div class="card"><div class="sec tap" onclick="fold(this)">体重<span class="ar">▾</span></div><div class="body">`+(d.weights.map(w=>`<div class="row"><div class="n">⚖️ ${w.kg} kg</div><div class="k"><button class="x" onclick="del('weights',${w.id})">✕</button></div></div>`).join('')||`<div class="empty">还没有记录</div>`)
  +`</div></div><div class="card"><div class="sec tap" onclick="fold(this)">作息<span class="ar">▾</span></div><div class="body">`+(d.sleeps.map(s=>`<div class="row"><div class="n">${sleepTxt(s)}<small>${esc(s.note)}</small></div><div class="k"><button class="x" onclick="del('sleeps',${s.id})">✕</button></div></div>`).join('')||`<div class="empty">还没有记录</div>`)
  +`</div></div><div id="chat"></div>`;
  $('#main').innerHTML=h;drawChat()}
function fold(el){el.closest('.card').classList.toggle('fold')}
async function del(k,id){if(confirm('删除这条记录？')){await api(k+'/'+id,{method:'DELETE'});render()}}
function ex(i){$('#txt').value=EX[i];$('#txt').focus()}
function drawChat(){
  const el=$('#chat');if(!el)return;const L=chat[date]||[];
  if(!L.length){el.innerHTML=`<div class="chips">`+EX.map((e,i)=>`<button class="chip" onclick="ex(${i})">${esc(e.split('\n')[0])}</button>`).join('')+`</div>`;return}
  el.innerHTML=L.map((m,i)=>{
    if(m.me!==undefined)return `<div class="me">${esc(m.me)}${m.n?` 📷×${m.n}`:''}</div>`;
    if(m.err)return `<div class="card bot ${m.load?'':'err'}">${esc(m.err)}</div>`;
    const p=m.p;let h=`<div class="card bot"><div class="why">${esc(p.reply||'')}</div>`;
    if(p.date!==date)h+=`<div class="warn">⚠ 将记录到 ${p.date}</div>`;
    const inp=(t,j,v)=>`<input type="number" inputmode="numeric" value="${v}" ${m.done?'disabled':''} onchange="chat['${date}'][${i}].p.${t}[${j}].kcal=+this.value">`;
    p.meals.forEach((x,j)=>h+=`<div class="row"><div class="n">${MI[x.meal_type]||'🍽'} ${esc(x.name)}<small>${esc(x.meal_type)} ${esc(x.time)} ${esc(x.amount)}</small></div><div class="k">${inp('meals',j,x.kcal)}</div></div>`);
    p.workouts.forEach((x,j)=>h+=`<div class="row"><div class="n">🏃 ${esc(x.name)}<small>${esc(x.detail)}</small></div><div class="k w">${inp('workouts',j,x.kcal)}</div></div>`);
    p.weights.forEach((x,j)=>h+=`<div class="row"><div class="n">⚖️ 体重</div><div class="k"><input type="number" step="0.1" inputmode="decimal" value="${x.kg}" ${m.done?'disabled':''} onchange="chat['${date}'][${i}].p.weights[${j}].kg=+this.value"> kg</div></div>`);
    p.sleeps.forEach(x=>h+=`<div class="row"><div class="n">${sleepTxt(x)}<small>${esc(x.note)}</small></div></div>`);
    if(p.meals.length+p.workouts.length+p.weights.length+p.sleeps.length)
      h+=m.done?`<div class="empty" style="margin-top:6px">${m.done===1?'✓ 已记录':'已取消'}</div>`
      :`<div class="btns"><button class="btn" onclick="fin(${i},2)">取消</button><button class="btn p" onclick="fin(${i},1)">确认记录</button></div>`;
    return h+'</div>'}).join('');
  $('#main').scrollTop=1e9}
async function fin(i,s){
  const m=chat[date][i];
  try{if(s===1)await api('commit',{method:'POST',body:{date:m.p.date,meals:m.p.meals,workouts:m.p.workouts,weights:m.p.weights,sleeps:m.p.sleeps}});
    m.done=s;if(s===1&&m.p.date!==date)date=m.p.date;render()}catch(e){alert('保存失败：'+e.message)}}
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(f)})}
function badge(){const b=$('#nimg');b.hidden=!imgs.length;b.textContent=imgs.length}
$('#file').onchange=async e=>{for(const f of e.target.files)imgs.push(await shrink(f));e.target.value='';badge()};
$('#txt').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
async function send(){
  const text=$('#txt').value.trim();if(!text&&!imgs.length)return;
  const L=chat[date]=chat[date]||[];L.push({me:text,n:imgs.length});
  const images=imgs;imgs=[];badge();$('#txt').value='';$('#txt').style.height='auto';
  L.push({err:'分析中…',load:1});drawChat();$('#send').disabled=true;
  try{const now=new Date();
    const p=await api('parse',{method:'POST',body:{text,images,date,today:ymd(now),now:now.toTimeString().slice(0,5)}});
    L.pop();L.push({p})}catch(e){L.pop();L.push({err:'出错：'+e.message})}
  $('#send').disabled=false;drawChat()}
function chart(data,y,m,mode){
  const n=new Date(y,m,0).getDate(),key={w:'weight',i:'intake',b:'burn',s:'sleep'}[mode],pts=[];
  for(let i=1;i<=n;i++){const k=`${calMonth}-${String(i).padStart(2,'0')}`,v=data[k]&&data[k][key];if(v)pts.push({i,v,k})}
  if(!pts.length)return `<div class="card empty" style="text-align:center">本月还没有数据</div>`;
  const W=340,H=220,L=40,R=10,T=18,B=24,vs=pts.map(p=>p.v),last=vs[vs.length-1],col=mode==='b'?'var(--or)':mode==='s'?'#3b82f6':'var(--ac)';
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(mode==='w'){const pad=Math.max((hi-lo)*.3,.5);lo-=pad;hi+=pad}else{lo=0;hi*=1.15}
  const X=i=>L+(i-.5)*(W-L-R)/n,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),fmt=v=>mode==='w'?v.toFixed(1):mode==='s'?(v/60).toFixed(1):Math.round(v);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`;
  for(let k=0;k<4;k++){const v=lo+(hi-lo)*k/3;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="var(--sub)">${fmt(v)}</text>`}
  [1,5,10,15,20,25,30].filter(d=>d<=n).forEach(d=>s+=`<text x="${X(d)}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--sub)">${d}</text>`);
  const go_=p=>`onclick="date='${p.k}';go('day')"`;
  if(mode==='w'){
    s+=`<path d="${pts.map((p,k)=>(k?'L':'M')+X(p.i)+','+Y(p.v)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>s+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4.5" fill="var(--card)" stroke="${col}" stroke-width="2.5" ${go_(p)}/>`);
    const q=pts[pts.length-1];s+=`<text x="${Math.min(X(q.i),W-R-12)}" y="${Y(q.v)-9}" text-anchor="middle" font-size="11" font-weight="600" fill="${col}">${fmt(q.v)}</text>`;
  }else{
    const bw=(W-L-R)/n*.62;
    pts.forEach(p=>s+=`<rect x="${X(p.i)-bw/2}" y="${Y(p.v)}" width="${bw}" height="${H-B-Y(p.v)}" rx="3" fill="${col}" ${go_(p)}/>`);
  }
  const sum=vs.reduce((a,b)=>a+b,0),dlt=last-vs[0];
  const info=mode==='w'?`最新 ${fmt(last)} kg · 本月 ${dlt>=0?'+':''}${dlt.toFixed(1)} kg`
    :mode==='s'?`日均 ${(sum/vs.length/60).toFixed(1)} h · 共 ${pts.length} 天`
    :`日均 ${Math.round(sum/vs.length)} · 共 ${Math.round(sum)} kcal`;
  return `<div class="card"><div class="sec">${{w:'体重变化',i:'每日摄入',b:'每日运动消耗',s:'每日睡眠时长'}[mode]}<em>${info}</em></div>${s}</svg><div class="empty" style="text-align:center">点击数据点或柱子可跳到当天</div></div>`}
async function renderCal(){
  const data=await api('month?month='+calMonth),[y,m]=calMonth.split('-').map(Number);
  const seg=`<div class="seg">`+[['c','日历'],['w','体重'],['i','摄入'],['b','运动'],['s','睡眠']].map(([k,l])=>`<button class="${calMode===k?'on':''}" onclick="calMode='${k}';render()">${l}</button>`).join('')+`</div>`;
  if(calMode!=='c'){$('#main').innerHTML=seg+chart(data,y,m,calMode);return}
  const first=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate(),td=ymd(new Date());
  let h=seg+'<div class="cal">'+[...'一二三四五六日'].map(x=>`<div class="wd">${x}</div>`).join('')+'<i></i>'.repeat(first);
  for(let i=1;i<=n;i++){const k=`${calMonth}-${String(i).padStart(2,'0')}`,v=data[k];
    h+=`<button class="${k===td?'t':''} ${v?'has':''}" onclick="date='${k}';go('day')">${i}${v&&v.intake?`<small>${v.intake}</small>`:''}${v&&v.burn?`<small class="b">-${v.burn}</small>`:''}${v&&v.weight?`<small class="g">${v.weight}</small>`:''}${v&&v.sleep?`<small class="s">😴${(v.sleep/60).toFixed(1)}h</small>`:''}</button>`}
  $('#main').innerHTML=h+'</div><p class="empty" style="text-align:center;margin-top:14px">绿色：摄入 kcal　橙色：运动消耗 kcal　蓝色：体重 kg　😴：睡眠时长　点日期查看详情</p>'}
async function renderSet(){
  profile=await api('profile');const p=profile;
  const f=(id,l,t,v,x='')=>`<label>${l}</label><input class="f" id="f-${id}" type="${t}" ${x} value="${v??''}">`;
  $('#main').innerHTML=`<div class="card"><label style="margin-top:0">性别</label><select class="f" id="f-sex"><option value="male">男</option><option value="female">女</option></select>
  ${f('age','年龄','number',p.age,'inputmode=numeric')}${f('h','身高 (cm)','number',p.height_cm,'step=0.1 inputmode=decimal')}${f('w','当前体重 (kg)','number',p.weight_kg,'step=0.1 inputmode=decimal')}
  ${f('tw','目标体重 (kg)','number',p.target_weight_kg,'step=0.1 inputmode=decimal')}${f('td','目标日期','date',p.target_date,'min='+ymd(new Date()))}
  <button class="btn p" style="margin-top:20px;width:100%" onclick="saveP()">保存</button></div>`;
  $('#f-sex').value=p.sex||'male'}
async function saveP(){
  const g=i=>$('#f-'+i).value;
  if(!g('age')||!g('h')||!g('w')||!g('tw')||!g('td'))return alert('请填完整');
  try{await api('profile',{method:'POST',body:{sex:g('sex'),age:+g('age'),height_cm:+g('h'),weight_kg:+g('w'),target_weight_kg:+g('tw'),target_date:g('td')}});
    profile=await api('profile');go('day')}catch(e){alert('保存失败：'+e.message)}}
api('profile').then(p=>{profile=p;if(!p.height_cm)view='set';render()}).catch(e=>{$('#main').innerHTML=`<div class="card err">无法连接后端：${esc(e.message)}</div>`});
</script></body></html>
